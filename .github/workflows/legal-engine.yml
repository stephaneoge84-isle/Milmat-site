name: legal-engine
on:
  push:
    branches: ["feature/contravention-audit-foundation"]
  pull_request:
    branches: ["main"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          {
            echo "## TypeScript typecheck"
            echo '```text'
            cat typecheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file typecheck.log; fi
          exit $code
      - run: npm test
