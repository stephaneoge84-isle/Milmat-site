<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MILMAT — Audit FPS</title><style>body{font-family:Arial,sans-serif;background:#f5f7f8;color:#26323b;max-width:900px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #dbe2e7;border-radius:12px;padding:22px;margin:14px 0}label{display:block;margin:10px 0;font-weight:600}input,textarea,select{width:100%;padding:10px;box-sizing:border-box;margin-top:5px}textarea{min-height:100px}button{padding:11px 16px;margin-top:12px}.ok{border-left:5px solid #69A297}.warn{border-left:5px solid #C98535}.muted{color:#687681}</style></head><body><h1>MILMAT — Audit juridique FPS</h1><p class="muted">Le droit décide ; IA ne modifie pas les conclusions du moteur. Toute déclaration reste à vérifier par l utilisateur.</p><div class="card"><label>Motif<select id="ground"><option value="paiement">Paiement / droit de stationner</option><option value="vehicule">Véhicule / redevable</option><option value="document">Document / mentions</option><option value="notification">Notification / délai</option><option value="montant">Montant</option><option value="autre">Autre</option></select></label><label>Date des faits<input id="date" type="date" value="2026-09-23"></label><label>Date de notification<input id="notification" type="date"></label><label>Autorité RAPO<input id="authority" placeholder="Autorité indiquée sur l avis"></label><label>Explication<textarea id="facts"></textarea></label><label>Avis FPS complet, recto et verso <input id="complete" type="checkbox"></label><label>Importer une image de l avis pour OCR<input id="file" type="file" accept="image/*"></label><p id="ocr" class="muted"></p><label>Texte OCR<textarea id="ocrText" placeholder="Relisez toujours le texte OCR."></textarea></label><button id="analyze">Analyser le dossier</button></div><div id="result"></div><script type="module">import{analyzeFpsIntake}from "./legal-engine.js";import{extractImageText,mapFpsText}from "./document-ingestion.js";const $=id=>document.getElementById(id);$("file").addEventListener("change",async()=>{const f=$("file").files[0];if(!f)return;$("ocr").textContent="OCR en cours…";try{$("ocrText").value=await extractImageText(f);$("ocr").textContent="OCR terminé. Vérifiez le texte."}catch(e){$("ocr").textContent="OCR indisponible : "+e.message}});$("analyze").addEventListener("click",()=>{const mapped=mapFpsText($("ocrText").value);const complete=$("complete").checked;const authority=$("authority").value.trim();const n=$("notification").value;const data={...mapped,fpsNoticePart1Complete:complete,fpsNoticePart2Complete:complete,rapoAuthority:authority,paymentServiceCoordinates:complete?"à contrôler":"",paymentMethods:complete?"à contrôler":"",paymentDeadline:complete?"à contrôler":"",nonPaymentConsequence:complete?"à contrôler":"",rapoMandatory:complete,rapoDeadlineAndMethod:complete?"à contrôler":"",rapoSilenceRejection:complete?"à contrôler":"",tribunalAppealInfo:complete?"à contrôler":"",dataAccessRectification:complete?"à contrôler":"",noticeNotificationDate:n,notificationMode:n?"à documenter":"",notificationProof:n?"à documenter":"",rapoRequiredDocuments:complete,tribunalAppealDeadline:complete?"à contrôler":"",tribunalPriorPayment:complete};const r=analyzeFpsIntake({infractionDate:$("date").value,notificationDate:n,ground:$("ground").value,explanation:$("facts").value,answers:{},documents:complete?["Avis FPS complet"]:[],extractedData:data});let h="<div class='card'><h2>"+r.solidite+"</h2><p>Décision moteur : "+r.decision+"</p>";h+=r.deadlines?.rapo?"<p>Échéance RAPO calculée : "+r.deadlines.rapo.deadlineDate+"</p>":"";h+=r.deadlines?.payment?"<p>Échéance paiement calculée : "+r.deadlines.payment.deadlineDate+"</p>":"";h+="</div>";for(const c of r.checks){h+="<div class='card "+(c.status==="PRESENT_CONFORME"?"ok":"warn")+"'><b>"+c.ruleId+"</b><p>"+c.finding+"</p><p class='muted'>"+(c.request||"")+"</p></div>"}$("result").innerHTML=h});</script></body></html>
